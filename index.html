<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Malhar</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h3 { margin: 0 0 8px 0; }
    p { color: #aaaaaa; font-size: 14px; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      background-color: #6c5ce7;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      box-sizing: border-box;
      border: none;
      cursor: pointer;
    }
    .btn-secondary { background-color: #2d2d2d; }
  </style>
  <script>
    const params = "pa=malharmalisetti@naviaxis&pn=MALISETTI%20VENKATA%20MALHAR&cu=INR";
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (!isIOS) {
      // Auto-launch UPI chooser on Android
      window.location.replace("upi://pay?" + params);
    }
    function copyUPI() {
      navigator.clipboard.writeText("malharmalisetti@naviaxis");
      document.getElementById("copyBtn").innerText = "Copied: malharmalisetti@naviaxis!";
    }
  </script>
</head>
<body>
  <div class="card">
    <h3>Pay Malhar Malisetti</h3>
    <p>malharmalisetti@naviaxis</p>
    
    <!-- Works on all Android UPI apps -->
    <a class="btn" href="upi://pay?pa=malharmalisetti@naviaxis&pn=MALISETTI%20VENKATA%20MALHAR&cu=INR">Open UPI App (Android)</a>
    
    <!-- Specific app buttons that work on both iPhone & Android -->
    <a class="btn btn-secondary" href="tez://upi/pay?pa=malharmalisetti@naviaxis&pn=MALISETTI%20VENKATA%20MALHAR&cu=INR">Pay with Google Pay</a>
    <a class="btn btn-secondary" href="phonepe://pay?pa=malharmalisetti@naviaxis&pn=MALISETTI%20VENKATA%20MALHAR&cu=INR">Pay with PhonePe</a>
    <a class="btn btn-secondary" href="paytmmp://pay?pa=malharmalisetti@naviaxis&pn=MALISETTI%20VENKATA%20MALHAR&cu=INR">Pay with Paytm</a>
    
    <button id="copyBtn" class="btn btn-secondary" onclick="copyUPI()">Copy UPI ID</button>
  </div>
</body>
</html>
